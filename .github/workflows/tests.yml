name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.5"
          python-version: "3.13.5"
          enable-cache: true

      - name: Instalar dependencias (incluye dev)
        run: uv sync --locked --all-groups

      - name: Ejecutar tests
        run: uv run pytest
