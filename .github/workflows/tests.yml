name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version-file: ".tool-versions"
          enable-cache: true

      - name: Instalar dependencias (incluye dev)
        run: uv sync --locked --all-groups

      - name: Ejecutar tests
        run: uv run pytest
